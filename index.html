<style id="dk-theme">/* ============================================================
   DaurKita — Lapisan Tema (v1.8.3)
   1) Penyempurnaan mode terang (kontras + bayangan tipis konsisten)
   2) Mode gelap lengkap
   ============================================================ */

/* ---------- 1. MODE TERANG: penyempurnaan ---------- */
:root{
  --line:#e3ede7;
  --bg:#eaf4ec;
  --bg-2:#f4faf6;
  --sh-xs:0 1px 2px rgba(16,40,28,.05);
  --sh-sm:0 1px 2px rgba(16,40,28,.05),0 6px 16px rgba(16,40,28,.07);
  --sh-md:0 2px 6px rgba(16,40,28,.06),0 14px 30px rgba(16,40,28,.10);
  --sh-lg:0 4px 12px rgba(16,40,28,.06),0 22px 48px rgba(16,40,28,.13);
}
body{background:#0b1220}
.app-shell{background:linear-gradient(180deg,#f6faf8 0%,#edf4f0 100%)}
.topbar{background:rgba(246,250,248,.86)}

/* bayangan tipis konsisten untuk SEMUA permukaan */
.card,
.stat3 .s3,
.stat,
.summary,
.menu,
.field-row,
.cat-card,
.quick .q,
.cat-mini,
.notif-item,
.set-card,
.faq-card,
.tip-card,
.profile-card,
.banner,
.green-banner,
.pf-hero,
.pf-bal,
.help-hero{
  box-shadow:var(--sh-sm);
  border:1px solid var(--line);
}
.card,.set-card,.faq-card,.menu,.notif-item,.tip-card,.profile-card,.stat,.summary,.cat-mini,.cat-card,.quick .q,.field-row,.stat3 .s3{border-radius:20px}

/* halaman Akun: hilangkan kesan "putih puyeh" */
.pf-hero{
  background:linear-gradient(160deg,#ffffff 0%,#f1faf4 62%,#e8f7ee 100%);
  border:1px solid #dff0e6;
  box-shadow:0 2px 6px rgba(16,40,28,.05),0 16px 34px rgba(16,40,28,.10);
}
.pf-avatar{
  background:linear-gradient(160deg,#e8f9ef,#d2efdf);
  border:1px solid #cfeadc;
  box-shadow:inset 0 1px 0 #fff,0 6px 14px rgba(16,80,45,.10);
}
.pf-addr{background:#f4f9f6;border:1px solid #e2eee7;color:#3d5347}
.pf-bal{
  background:linear-gradient(160deg,#f2fbf6,#e4f6ea);
  border:1px solid #d5eedd;
  box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(16,80,45,.07);
}
.stat3 .s3{background:linear-gradient(180deg,#ffffff,#fafdfb)}
.stat3 .s3 .ic{background:linear-gradient(160deg,#eefaf2,#dcf3e5);box-shadow:inset 0 1px 0 #fff}
.stat3 .s3:hover{box-shadow:var(--sh-md)}
.menu{background:#fff}
.menu-item .mi,.set-row .si,.field-row .fi{background:linear-gradient(160deg,#eefaf2,#ddf4e6);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(20,80,45,.06)}
.tip-card{background:linear-gradient(150deg,#f4fcf7,#e9f8ef);border:1px solid #dcefe3}
.tip-ic{background:linear-gradient(160deg,#ffffff,#eaf7ef);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(20,80,45,.08)}
.notif-item{background:#fff;box-shadow:var(--sh-sm)}
.notif-item.unread{background:linear-gradient(150deg,#f2fbf6,#e9f7ee)}
.banner,.green-banner{background:linear-gradient(150deg,#f1fbf5,#e4f5ea);border:1px solid #d9eee1}
.set-card,.faq-card{background:#fff}
.set-select,.set-field input{background:#fff}
.btn-ghost{background:#fff}
.btn-ghost:hover{background:#f7fdfa}

/* tombol tema */
.theme-btn{font-size:17px;line-height:1}
.theme-btn::before{content:"🌙"}
html[data-theme="dark"] .theme-btn::before{content:"☀️"}

/* ---------- 2. MODE GELAP ---------- */
html[data-theme="dark"]{
  --brand:#1eb45a;
  --brand-dark:#4ade80;
  --brand-light:rgba(34,197,94,.18);
  --brand-soft:rgba(34,197,94,.10);
  --bg:#0a1411;
  --bg-2:#0f1e18;
  --card:#15231c;
  --line:#25392e;
  --ink:#e9f4ed;
  --muted:#8fa79a;
  --red:#f87171;
  --sh-xs:0 1px 2px rgba(0,0,0,.5);
  --sh-sm:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.42);
  --sh-md:0 2px 8px rgba(0,0,0,.5),0 14px 30px rgba(0,0,0,.52);
  --sh-lg:0 4px 14px rgba(0,0,0,.55),0 22px 48px rgba(0,0,0,.6);
}
html[data-theme="dark"] body{background:#050b09;color:var(--ink)}
html[data-theme="dark"] .app-shell{
  background:radial-gradient(120% 60% at 50% 0%,rgba(34,197,94,.10),transparent 60%),linear-gradient(180deg,#0f1e18 0%,#0a1411 55%,#08110e 100%);
  box-shadow:0 0 70px rgba(0,0,0,.75);
}
html[data-theme="dark"] .topbar{background:rgba(15,30,24,.86)}
html[data-theme="dark"] .bottomnav{background:rgba(17,32,25,.96);box-shadow:0 -6px 24px rgba(0,0,0,.55)}
html[data-theme="dark"] .icon-btn{background:#1b2c23;color:var(--ink)}
html[data-theme="dark"] .bell{background:#1b2c23}
html[data-theme="dark"] .bell .dot,html[data-theme="dark"] .bell .cnt{border-color:#15231c}
html[data-theme="dark"] .seg{background:rgba(34,197,94,.10)}

<script id="dk-theme-init">(function(){
  var KEY="daurkita-theme";
  function read(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function save(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function isDark(){return document.documentElement.getAttribute("data-theme")==="dark"}
  function apply(t){
    document.documentElement.setAttribute("data-theme",t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute("content",t==="dark"?"#0a1411":"#16a34a");
  }
  var t=read();
  if(t!=="dark"&&t!=="light")t="light";
  apply(t);
  window.DaurKitaTheme={
    current:function(){return isDark()?"dark":"light"},
    isDark:isDark,
    set:function(v){var n=v==="dark"?"dark":"light";save(n);apply(n);return n},
    toggle:function(){return this.set(isDark()?"light":"dark")}
  };
})();
</script>

<body>
<div id="app"></div>
<script>
/* ============================================================
   DaurKita — lapisan data terhubung backend (REST API)
   Ganti nilai di bawah sesuai server yang dipakai.
   ============================================================ */
window.DAURKITA_API_URL = window.DAURKITA_API_URL || ((location.protocol === "http:" || location.protocol === "https:") ? location.origin : "http://localhost:3000");
window.DAURKITA_GOOGLE_CLIENT_ID = window.DAURKITA_GOOGLE_CLIENT_ID || "";

window.Store = (function () {
  var API = String(window.DAURKITA_API_URL || "").replace(/\/+$/, "");
  var TKEY = "dk_token", CKEY = "dk_cache";
  var cache = read();
  var onchange = null, priceTimer = null, pollTimer = null;

  function blank() {
    return { me: null, categories: [], collectors: [], prices: [], users: [], orders: [], order_items: [], transactions: [], notifications: [], settings: null, stats: null };
  }
  function read() {
    var b = blank();
    try { var d = JSON.parse(localStorage.getItem(CKEY) || "null"); if (d) for (var k in b) if (k in d) b[k] = d[k]; } catch (e) {}
    return b;
  }
  function save() { try { localStorage.setItem(CKEY, JSON.stringify(cache)); } catch (e) {} }
  function token() { try { return localStorage.getItem(TKEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { t ? localStorage.setItem(TKEY, t) : localStorage.removeItem(TKEY); } catch (e) {} }
  function uid(p) { var s = "abcdefghijklmnopqrstuvwxyz0123456789", o = ""; for (var i = 0; i < 8; i++) o += s[Math.floor(Math.random() * s.length)]; return (p ? p + "_" : "") + o; }
  function nowISO() { return new Date().toISOString(); }
  function todayISO() { return nowISO().slice(0, 10); }
  function rupiah(n) { return "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID"); }
  /* ===== Sistem level poin (4 tingkat) ===== */
  var LEVELS = [
    { min: 0,    nama: "Bibit",         icon: "🌱", next: 100  },
    { min: 100,  nama: "Tunas",         icon: "🌿", next: 500  },
    { min: 500,  nama: "Rimbun",        icon: "🌳", next: 1500 },
    { min: 1500, nama: "Legenda Hijau", icon: "🏆", next: null }
  ];
  function levelFor(poin) {
    var p = Math.max(0, Number(poin) || 0), lv = LEVELS[0], idx = 0;
    for (var i = 0; i < LEVELS.length; i++) if (p >= LEVELS[i].min) { lv = LEVELS[i]; idx = i; }
    var next = lv.next;
    var progress = next == null ? 100 : Math.min(100, Math.round((p - lv.min) / (next - lv.min) * 100));
    return { index: idx, nama: lv.nama, icon: lv.icon, min: lv.min, next: next,
             progress: progress, toNext: next == null ? 0 : Math.max(0, next - p) };
  }
  function joinYear(u) {
    var d = u && u.created_at ? new Date(u.created_at) : new Date();
    return isNaN(d.getTime()) ? new Date().getFullYear() : d.getFullYear();
  }
  function distanceKm(a, b, c, d) {
    if (a == null || b == null || c == null || d == null) return null;
    var R = 6371, r = function (x) { return x * Math.PI / 180; };
    var dl = r(c - a), dn = r(d - b);
    var s = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dn / 2) * Math.sin(dn / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function fire() { save(); if (onchange) { try { onchange(); } catch (e) {} } }

  async function req(path, opt) {
    opt = opt || {};
    var h = { "Content-Type": "application/json" };
    if (token()) h.Authorization = "Bearer " + token();
    var res;
    try {
      res = await fetch(API + path, { method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
    } catch (e) {
      throw new Error("Tidak dapat menghubungi server. Periksa koneksi internet.");
    }
    var data = null; try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error((data && data.error) || ("Permintaan gagal (" + res.status + ")"));
      err.status = res.status; throw err;
    }
    return data || {};
  }

  function apply(d) {
    cache.me = d.me || null;
    cache.categories = d.categories || [];
    cache.collectors = d.collectors || [];
    cache.prices = d.prices || [];
    cache.users = d.users || [];
    // selaraskan nama field server -> nama yang dipakai antarmuka
    cache.orders = (d.orders || []).map(function (o) {
      return Object.assign({}, o, {
        tanggal_jemput: o.tanggal_jemput || o.tanggal || "",
        slot_waktu: o.slot_waktu || o.slot || "",
        alamat_penjemputan: o.alamat_penjemputan || o.alamat || "",
      });
    });
    cache.order_items = (d.order_items || []).map(function (i) {
      return Object.assign({}, i, { harga_satuan: i.harga_satuan != null ? i.harga_satuan : i.harga_per_kg });
    });
    cache.transactions = (d.transactions || []).map(function (t) {
      return Object.assign({}, t, { metode_bayar: t.metode_bayar || t.metode || "transfer" });
    });
    cache.notifications = d.notifications || [];
    cache.settings = d.settings || null;
    cache.stats = d.stats || null;
    // harga acuan = harga tertinggi antar mitra pengepul
    cache.categories.forEach(function (c) {
      var mx = 0;
      cache.prices.forEach(function (p) { if (p.category_id === c.id && Number(p.harga_per_kg) > mx) mx = Number(p.harga_per_kg); });
      c.harga_acuan = mx;
    });
  }

  async function hydrate() { if (!token()) return false; var d = await req("/api/bootstrap"); apply(d); save(); return true; }

  /* ================= auth ================= */
  async function login(role, email, password) {
    var d = await req("/api/auth/login", { method: "POST", body: { email: email, password: password } });
    if (role && d.account && d.account.role !== role) throw new Error("Akun ini terdaftar sebagai " + ("collector" === d.account.role ? "Pengepul" : "Pengguna"));
    setToken(d.token); await hydrate(); return cache.me;
  }
  async function register(role, payload) {
    var body = Object.assign({}, payload, { role: role });
    if (role === "collector") { body.nama_lapak = payload.nama_lapak || payload.nama; body.pemilik = payload.nama; }
    var d = await req("/api/auth/register", { method: "POST", body: body });
    setToken(d.token); await hydrate(); return cache.me;
  }
  async function loginGoogle(credential, role) {
    var d = await req("/api/auth/google", { method: "POST", body: { credential: credential, role: role } });
    setToken(d.token); await hydrate(); return cache.me;
  }
  function logout() { setToken(""); cache = blank(); save(); if (onchange) { try { onchange(); } catch (e) {} } }

  /* ================= baca (dari cache) ================= */
  function session() { return cache.me ? { role: cache.me.role, id: cache.me.id } : null; }
  function currentUser() { return cache.me; }
  function categories() { return cache.categories; }
  function all(t) { return cache[t] || []; }
  function find(t, id) { var arr = cache[t] || []; for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function priceFor(cid, catid) {
    var arr = cache.prices || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].collector_id === cid && arr[i].category_id === catid) return Number(arr[i].harga_per_kg) || 0;
    return 0;
  }
  function collectorsFor(lat, lng, catid) {
    var arr = (cache.collectors || []).map(function (c) {
      var jarak = (lat != null && lng != null) ? distanceKm(Number(lat), Number(lng), c.lat, c.lng) : null;
      return Object.assign({}, c, { jarak_km: jarak, harga: catid ? priceFor(c.id, catid) : null });
    });
    if (catid) arr = arr.filter(function (c) { return c.harga > 0; });
    arr.sort(function (a, b) { return (a.jarak_km == null ? 1e9 : a.jarak_km) - (b.jarak_km == null ? 1e9 : b.jarak_km); });
    return arr;
  }
  function orderItems(orderId) {
    return (cache.order_items || []).filter(function (i) { return i.order_id === orderId; }).map(function (i) {
      var c = find("categories", i.category_id);
      return Object.assign({}, i, { kategori: c ? c.nama_kategori : "?", icon: (c && c.icon) || "♻️" });
    });
  }
  function ordersForUser(id) { return (cache.orders || []).filter(function (o) { return o.user_id === id; }); }
  function ordersForCollector(id) { return (cache.orders || []).filter(function (o) { return o.collector_id === id; }); }
  function orderById(id) { return find("orders", id); }
  function transactionForOrder(id) { var t = cache.transactions || []; for (var i = 0; i < t.length; i++) if (t[i].order_id === id) return t[i]; return null; }
  function statsForCollector(id) {
    var s = cache.stats || {};
    return {
      masuk: s.masuk || 0,
      aktif: s.aktif != null ? s.aktif : (s.berjalan || 0),
      selesai: s.selesai || 0,
      pendapatan: s.pendapatan || 0,
      kg: s.kg != null ? s.kg : (s.total_kg || 0),
    };
  }
  function notificationsFor(role, id) { return cache.notifications || []; }
  function unreadCount(role, id) { return (cache.notifications || []).filter(function (n) { return !n.read; }).length; }
  function getSettings(role, id) {
    return cache.settings || { notifOrders: true, notifPromo: true, showBanner: true, showCompleted: true, defaultSlot: "10:00-12:00" };
  }

  /* ================= tulis ================= */
  async function createOrder(payload) {
    var d = await req("/api/orders", { method: "POST", body: payload });
    await hydrate();
    return orderById(d.order && d.order.id) || d.order;
  }
  async function setOrderStatus(id, status) {
    var d = await req("/api/orders/" + id + "/status", { method: "PATCH", body: { status: status } });
    await hydrate();
    return d.order;
  }
  async function completeOrder(id, weightMap) {
    var items = Object.keys(weightMap || {}).map(function (k) { return { item_id: k, berat_aktual: Number(weightMap[k]) }; });
    var d = await req("/api/orders/" + id + "/complete", { method: "POST", body: { items: items } });
    await hydrate();
    var tx = d.transaction || transactionForOrder(id);
    return { order: d.order, transaction: tx, net: tx ? tx.net : 0, total: tx ? tx.total : 0, fee: tx ? tx.admin_fee : 0 };
  }
  function setPrice(cid, catid, harga) {
    var arr = cache.prices || [], found = false;
    for (var i = 0; i < arr.length; i++) if (arr[i].collector_id === cid && arr[i].category_id === catid) { arr[i].harga_per_kg = harga; found = true; }
    if (!found) arr.push({ id: uid("prc"), collector_id: cid, category_id: catid, harga_per_kg: harga });
    cache.prices = arr; save();
    if (priceTimer) clearTimeout(priceTimer);
    priceTimer = setTimeout(function () {
      var mine = (cache.prices || []).filter(function (p) { return p.collector_id === cid; })
        .map(function (p) { return { category_id: p.category_id, harga_per_kg: p.harga_per_kg }; });
      req("/api/prices", { method: "PUT", body: { items: mine } }).catch(function (e) { console.warn("Simpan harga gagal:", e.message); });
    }, 500);
  }
  function update(table, id, patch) {
    if (cache.me && cache.me.id === id) cache.me = Object.assign({}, cache.me, patch);
    save();
    req("/api/profile", { method: "PUT", body: patch })
      .then(function (d) { if (d.account) { cache.me = d.account; fire(); } })
      .catch(function (e) { console.warn("Simpan profil gagal:", e.message); });
  }
  function setSetting(role, id, key, val) {
    cache.settings = Object.assign({}, getSettings(role, id));
    cache.settings[key] = val; save();
    req("/api/settings", { method: "PUT", body: cache.settings }).catch(function (e) { console.warn(e.message); });
  }
  function notify(role, id, type, title, body, orderId) {
    var n = { id: uid("ntf"), role: role, ref_id: id, type: type, title: title, body: body || "", order_id: orderId || null, read: false, created_at: nowISO() };
    cache.notifications = [n].concat(cache.notifications || []); save();
    req("/api/notifications/self", { method: "POST", body: { type: type, title: title, body: body, order_id: orderId } }).catch(function () {});
    return n;
  }
  function markNotifRead(id) {
    (cache.notifications || []).forEach(function (n) { if (n.id === id) n.read = true; }); save();
    req("/api/notifications/read", { method: "POST", body: { id: id } }).catch(function () {});
  }
  function markAllNotifsRead(role, id) {
    (cache.notifications || []).forEach(function (n) { n.read = true; }); save();
    req("/api/notifications/read", { method: "POST", body: { all: true } }).catch(function () {});
  }
  function clearNotifs(role, id) {
    cache.notifications = []; save();
    req("/api/notifications", { method: "DELETE" }).catch(function () {});
  }
  function resetAll() { logout(); }

  /* ================= sinkronisasi berkala ================= */
  function startPolling(ms) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (!token() || !cache.me) return;
      hydrate().then(function () { fire(); }).catch(function () {});
    }, ms || 20000);
  }

  return {
    rupiah: rupiah, levelFor: levelFor, joinYear: joinYear, all: all, find: find, update: update,
    register: register, login: login, loginGoogle: loginGoogle, logout: logout,
    session: session, currentUser: currentUser, categories: categories,
    priceFor: priceFor, setPrice: setPrice, collectorsFor: collectorsFor,
    createOrder: createOrder, orderItems: orderItems,
    ordersForUser: ordersForUser, ordersForCollector: ordersForCollector, orderById: orderById,
    setOrderStatus: setOrderStatus, completeOrder: completeOrder, transactionForOrder: transactionForOrder,
    statsForCollector: statsForCollector, resetAll: resetAll,
    distanceKm: distanceKm, todayISO: todayISO, nowISO: nowISO, uid: uid,
    getSettings: getSettings, setSetting: setSetting, notify: notify,
    notificationsFor: notificationsFor, unreadCount: unreadCount,
    markNotifRead: markNotifRead, markAllNotifsRead: markAllNotifsRead, clearNotifs: clearNotifs,
    hydrate: hydrate, startPolling: startPolling,
    onSync: function (fn) { onchange = fn; },
    isReady: function () { return !!cache.me; },
    token: token, apiUrl: API,
  };
})();
